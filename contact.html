<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Get in touch with me through this contact form." />
  <meta name="keywords" content="HTML, contact form, email" />
  <meta name="author" content="Your Name" />
  <title>Contact | My Basic Website</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>My Basic Website</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="articles.html">Articles</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>

    <!-- Dark Mode Toggle Button -->
    <button id="darkModeToggle" aria-label="Toggle Dark Mode">🌙</button>
  </header>

  <main>
    <section class="hero colorful">
      <div class="hero-content">
        <h2>Contact Me</h2>
        <p>
          Have a question or a project idea? I’d love to hear from you. 
          Fill out the form below and I’ll get back to you soon!
        </p>
      </div>
    </section>

    <section class="contact-section">
      <form action="#" method="post" class="contact-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 My Basic Website | All rights reserved.</p>
  </footer>

  <!-- Dark Mode Script -->
  <script>
    const toggleButton = document.getElementById("darkModeToggle");
    toggleButton.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      toggleButton.textContent = document.body.classList.contains("dark-mode") ? "☀️" : "🌙";
    });
  </script>
</body>
</html>
